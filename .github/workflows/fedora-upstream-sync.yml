name: Fedora upstream sync

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fedora-upstream-sync
  cancel-in-progress: false

jobs:
  merge:
    if: github.repository == 'MCC45TR/xdg-desktop-portal-cutefish'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream and preserve downstream commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          before=$(git rev-parse HEAD)
          git diff --quiet
          git diff --cached --quiet
          git fetch --no-tags https://github.com/cutefishos/xdg-desktop-portal-cutefish.git refs/heads/main
          if ! git merge --no-edit FETCH_HEAD; then
            git merge --abort
            echo 'Upstream conflicts with downstream changes; nothing was pushed.' >&2
            exit 1
          fi
          git diff --check "$before" HEAD
          git push origin HEAD:main
